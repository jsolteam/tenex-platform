# LOCAL - полный стек
# Запуск: docker compose --env-file .env up --build

services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tenex}
      POSTGRES_USER: ${DB_USER:-tenex}
      POSTGRES_PASSWORD: ${DB_PASS:-tenex}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-tenex} -d ${DB_NAME:-tenex}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --loglevel warning
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY:-tenex}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:-tenex123}
    ports:
      - "9000:9000"
      - "9001:9001"   # Web UI
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ${S3_KEY:-tenex} ${S3_SECRET:-tenex123} &&
        mc mb --ignore-existing local/${S3_BUCKET:-tenex} &&
        echo 'bucket ${S3_BUCKET:-tenex} ready'
      "

  # ── Observability ─────────────────────────────────────────────────────────

  loki:
    image: grafana/loki:3.5.12
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ../../../deploy/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  tempo:
    image: grafana/tempo:2.10.2
    restart: unless-stopped
    command: -config.file=/etc/tempo/config.yaml
    ports:
      - "3200:3200"
    volumes:
      - ../../../deploy/observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

  tempo-health:
    image: curlimages/curl:8.2.1
    restart: "no"
    depends_on:
      tempo:
        condition: service_started
    entrypoint:
      - sh
      - -c
      - |
        echo "Waiting for Tempo..."
        while ! curl -sf http://tempo:3200/ready; do sleep 2; done
        echo "Tempo ready."

  otel:
    image: otel/opentelemetry-collector-contrib:0.147.0
    restart: unless-stopped
    command: --config=/etc/otel/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ../../../deploy/observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      tempo-health:
        condition: service_completed_successfully

  otel-health:
    image: curlimages/curl:8.2.1
    restart: "no"
    depends_on:
      otel:
        condition: service_started
    entrypoint:
      - sh
      - -c
      - |
        echo "Waiting for OTel..."
        while ! curl -sf http://otel:13133; do sleep 2; done
        echo "OTel ready."

  prometheus:
    image: prom/prometheus:v3.10.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/config.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    volumes:
      - ../../../deploy/observability/prometheus.yaml:/etc/prometheus/config.yaml:ro
      - prometheus-data:/prometheus
    depends_on:
      otel-health:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor traceToMetrics"
    volumes:
      - ../../../deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Migrations ────────────────────────────────────────────────────────────

  migrate:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: migrate
    restart: "no"
    command: [ "up" ]
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-tenex}
      DB_PASS: ${DB_PASS:-tenex}
      DB_NAME: ${DB_NAME:-tenex}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Platform ──────────────────────────────────────────────────────────────

  bot-telegram:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: bot
    restart: unless-stopped
    env_file: .env
    environment:
      MESSENGER: telegram
      MESSENGER_TOKEN: ${TELEGRAM_TOKEN}
    ports:
      - "9093:9090"   # metrics
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-health:
        condition: service_completed_successfully
      loki:
        condition: service_healthy

  # bot-vk:
  #   build:
  #     context:    ../../
  #     dockerfile: deploy/docker/Dockerfile
  #     args:
  #       BINARY: bot
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     MESSENGER:       vk
  #     MESSENGER_TOKEN: ${VKONTAKTE_TOKEN}
  #   ports:
  #     - "9094:9090"
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
  #     redis:
  #       condition: service_healthy

  scheduler:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: scheduler
    restart: unless-stopped
    env_file: .env
    ports:
      - "9091:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: worker
    restart: unless-stopped
    env_file: .env
    ports:
      - "9092:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
