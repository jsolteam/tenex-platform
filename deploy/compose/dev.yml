version: "3.9"

services:
  bot:
    extends:
      file: local.yml
      service: bot

  postgres:
    extends:
      file: local.yml
      service: postgres

  redis:
    extends:
      file: local.yml
      service: redis

  prometheus:
    image: prom/prometheus
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"