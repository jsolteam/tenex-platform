version: "3.9"

# dev.yml extends local.yml for all shared services and adds the full
# observability stack (Prometheus, Grafana, Loki, Tempo).
#
# Usage: make dev-up

services:
  bot:
    extends:
      file: local.yml
      service: bot

  postgres:
    extends:
      file: local.yml
      service: postgres

  redis:
    extends:
      file: local.yml
      service: redis

  minio:
    extends:
      file: local.yml
      service: minio

  loki:
    # Explicitly configured — consistent with local.yml.
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ../observability/loki-local.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo-local.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    extends:
      file: local.yml
      service: otel-collector
    depends_on:
      tempo: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      prometheus: { condition: service_healthy }
      loki:       { condition: service_healthy }
      tempo:      { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5