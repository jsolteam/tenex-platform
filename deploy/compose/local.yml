version: "3.9"

services:
  bot:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    command: ./tenex
    env_file:
      - ../../.env
    depends_on:
      - postgres
      - redis

  scheduler:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    command: ./scheduler
    env_file:
      - ../../.env
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    command: ./worker
    env_file:
      - ../../.env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tenex
      POSTGRES_USER: tenex
      POSTGRES_PASSWORD: tenex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: tenex
      MINIO_ROOT_PASSWORD: tenex123
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data: