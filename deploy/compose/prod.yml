version: "3.9"

services:
  bot:
    image: tenex/bot:latest
    restart: always
    env_file: ../../.env
    depends_on:
      - postgres
      - redis

  scheduler:
    image: tenex/scheduler:latest
    restart: always

  worker:
    image: tenex/worker:latest
    restart: always

  postgres:
    image: postgres:16
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always

volumes:
  postgres-data: