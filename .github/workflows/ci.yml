name: CI

on:
  push:
    branches:
      - develop
      - feature/**
      - infra/**
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenex
          POSTGRES_PASSWORD: tenex
          POSTGRES_DB: tenex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tenex"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download deps
        run: go mod download

      - name: Run lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Run tests
        run: go test ./... -v -race

      - name: Build
        run: go build ./...