name: Dev Build

on:
  push:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/tenex-platform

jobs:
  build:
    name: Build ${{ matrix.binary }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        binary: [bot, scheduler, worker, migrate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          build-args: |
            BINARY=${{ matrix.binary }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.binary }}:dev